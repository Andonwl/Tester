<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Information</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f6;
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #d6dce5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .admin-sidebar-top {
            display: flex;
            flex-direction: column;
        }

        .admin-logo {
            padding: 16px 20px;
            border-bottom: 1px solid #e6ebf1;
            margin-bottom: 8px;
        }

        .admin-logo img {
            width: 200px;
            height: auto;
            display: block;
        }

        .admin-sidebar h2 {
            padding: 0 24px 12px;
            margin: 0;
            font-size: 18px;
            color: #1c3557;
        }

        .admin-sidebar ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .admin-sidebar a {
            display: block;
            padding: 12px 24px;
            color: #2d3d65;
            text-decoration: none;
            font-size: 15px;
            border-left: 4px solid transparent;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: #eef4fa;
            color: #1c3557;
            font-weight: bold;
            border-left: 4px solid #1a5ea8;
        }

        .admin-sidebar-bottom {
            padding: 18px 24px;
            border-top: 1px solid #e6ebf1;
        }

        .admin-main {
            flex: 1;
            padding: 28px 24px;
            background: #f1f3f6;
        }

        h2 {
            margin-bottom: 20px;
            color: #1c3557;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #d6dce5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f3f4f7;
            color: #1c3557;
        }

        .empty {
            text-align: center;
            color: gray;
            font-style: italic;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }

            .admin-sidebar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<aside class="admin-sidebar">
    <div class="admin-sidebar-top">
        <div class="admin-logo">
            <img src="/bridgetrack-logo.jpeg" alt="BridgeTrack Logo">
        </div>

        <h2>Instructor Dashboard</h2>

        <ul>
            <li><a href="/instructor/dashboard">Dashboard</a></li>
            <li><a href="/instructor/rosters">View Rosters</a></li>
            <li><a class="active" href="/instructor/contact-info">Contact Info</a></li>
            <li><a href="/instructor/attendance/history">Attendance History</a></li>
            <li><a href="/instructor/attendance">Record Attendance</a></li>
            <li><a href="/instructor/reports">Export Reports</a></li>
        </ul>
    </div>

    <div class="admin-sidebar-bottom">
        <a href="/logout">Logout</a>
    </div>
</aside>

<main class="admin-main">
    <h2>Student Contact Information</h2>

    <div class="panel">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
            </thead>

            <tbody>
                <tr th:if="${roster == null or #lists.isEmpty(roster)}">
                    <td colspan="3" class="empty">No students found</td>
                </tr>

                <tr th:each="student : ${roster}">
                    <td th:text="${student.firstName + ' ' + student.lastName}"></td>
                    <td th:text="${student.studentEmail}"></td>
                    <td th:text="${student.phone}"></td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
