<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Record Attendance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f6;
            display: flex;
            min-height: 100vh;
        }

        .admin-sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #d6dce5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .admin-logo {
            padding: 16px 20px;
            border-bottom: 1px solid #e6ebf1;
        }

        .admin-logo img {
            width: 200px;
        }

        .admin-sidebar h2 {
            padding: 16px 24px 8px;
            margin: 0;
            font-size: 18px;
            color: #1c3557;
        }

        .admin-sidebar a {
            display: block;
            padding: 12px 24px;
            text-decoration: none;
            color: #2d3d65;
            border-left: 4px solid transparent;
        }

        .admin-sidebar a:hover,
        .admin-sidebar a.active {
            background: #eef4fa;
            font-weight: bold;
            border-left: 4px solid #1a5ea8;
        }

        .admin-sidebar-bottom {
            padding: 18px 24px;
            border-top: 1px solid #e6ebf1;
        }

        .admin-main {
            flex: 1;
            padding: 28px;
        }

        h1 {
            color: #1c3557;
            margin-bottom: 20px;
        }

        .section {
            background: white;
            border: 1px solid #d6dce5;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .section-header {
            background: #dfe7f2;
            padding: 12px 16px;
            font-weight: bold;
        }

        .section-body {
            padding: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 200px auto;
            gap: 12px;
        }

        select, input {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #cfd8e3;
        }

        .btn {
            background: #1c3557;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-secondary {
            background: #7a8088;
        }

        .student-row {
            display: grid;
            grid-template-columns: 1fr 140px 140px;
            padding: 12px;
            border-bottom: 1px solid #eee;
            align-items: center;
        }

        .student-name {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: gray;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .alert-success {
            background: #edf7ed;
            color: #256029;
        }

        .alert-error {
            background: #fdeeee;
            color: #a12622;
        }
    </style>
</head>

<body>

<aside class="admin-sidebar">
    <div>
        <div class="admin-logo">
            <img src="/bridgetrack-logo.jpeg">
        </div>

        <h2>Instructor Dashboard</h2>

		
		          <li><a href="/instructor/dashboard">Dashboard</a></li>
		          <li><a href="/instructor/rosters">View Rosters</a></li>
		          <li><a href="/instructor/attendance/history">Attendance History</a></li>
		          <li><a class="active" href="/instructor/attendance">Record Attendance</a></li>
		      
    </div>

    <div class="admin-sidebar-bottom">
        <a href="/logout">Logout</a>
    </div>
</aside>

<main class="admin-main">

    <h1>Record Attendance</h1>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="section">
        <div class="section-header">Session Picker</div>
        <div class="section-body">
            <form th:action="@{/instructor/attendance}" method="get">
                <div class="form-row">
                    <select name="sectionId" required>
                        <option value="">Select Section</option>
                        <option th:each="s : ${sectionOptions}"
                                th:value="${s.sectionId}"
                                th:text="${s.optionLabel}">
                        </option>
                    </select>

                    <input type="date" name="sessionDate" th:value="${sessionDate}" required>

                    <button type="submit" class="btn">Load</button>
                </div>
            </form>
        </div>
    </div>

    <div class="section">
        <div class="section-header">Attendance</div>
        <div class="section-body">

            <form th:action="@{/instructor/attendance/save}" method="post">

                <input type="hidden" name="sectionId" th:value="${selectedSectionId}">
                <input type="hidden" name="sessionDate" th:value="${sessionDate}">

                <div th:if="${rosterStudents != null}">
                    <div th:each="student : ${rosterStudents}" class="student-row">

                        <div>
                            <div class="student-name"
                                 th:text="${student.firstName + ' ' + student.lastName}"></div>
                        </div>

                        <label>
                            <input type="radio"
                                   th:name="${'status_' + student.studentId}"
                                   value="PRESENT"
                                   required> Present
                        </label>

                        <label>
                            <input type="radio"
                                   th:name="${'status_' + student.studentId}"
                                   value="ABSENT"> Absent
                        </label>

                    </div>
                </div>

                <div th:if="${rosterStudents == null}" class="empty">
                    Select a section and date to load students
                </div>

                <br>

                <button type="submit" class="btn">Save Attendance</button>
                <a href="/instructor/dashboard" class="btn btn-secondary">Cancel</a>

            </form>
        </div>
    </div>

</main>

</body>
</html>
